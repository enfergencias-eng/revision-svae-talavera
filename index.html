:root{--tit:"SVAE Titulo","Poppins","Avenir Next","Montserrat","Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,#d4e3f8 0,#e6eefa 340px,#eef4fc 100%) fixed;color:var(--ink);font:16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
@media (prefers-color-scheme:dark){body{background:#04112b linear-gradient(180deg,#04112b 0,#071c44 55%,#0a2a5c 100%) fixed}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b2a5c;z-index:20}
header{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:20px 12px 22px;color:#fff;border-bottom:5px solid var(--gold);
  background:linear-gradient(160deg,#061633 0%,#0b2a5c 48%,#1b4a8a 100%)}
.logorow{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;max-width:560px}
.logo{position:relative;width:clamp(128px,40vw,176px);height:clamp(128px,40vw,176px);border-radius:50%;flex:none;background:#0c2447;box-shadow:0 0 0 4px rgba(245,211,28,.9),0 8px 22px rgba(0,0,0,.4)}
.ecg{flex:1 1 0;min-width:0;height:clamp(56px,16vw,76px);overflow:visible}
.ecg path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ecg.vf path{stroke:#ff6b5e;filter:drop-shadow(0 0 3px rgba(255,107,94,.8))}
.ecg.rs path{stroke:#48c888;filter:drop-shadow(0 0 3px rgba(72,200,136,.8))}
header h1{position:relative;margin:16px 0 0;font:700 clamp(1.7rem,8.2vw,2.5rem)/1.05 var(--tit);text-transform:uppercase;letter-spacing:.07em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
header p{position:relative;margin:8px 0 0;color:var(--gold);font:700 .95rem/1.2 var(--tit);letter-spacing:.06em;text-transform:uppercase}
main{max-width:680px;margin:0 auto;padding:0 14px 40px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warnt);border:1.5px solid var(--gold);font-size:.92rem}
.banner button{margin-top:8px}

var CFG=JSON.parse(document.getElementById('svae-config').textContent);
var KEY='svae-ta-revision-v4';
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var CTX={},SECS=[],ALL=[];

/* ---------- utilidades ---------- */
function p2(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function nowTime(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());}
function fmtDate(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(iso||'');}
function stamp(){var d=new Date();return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function mod(a,n){return ((a%n)+n)%n;}
function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function $(id){return document.getElementById(id);}

/* ---------- calendario: nicho del día, ampulario, limpieza ---------- */
function dayInfo(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3],t=Date.UTC(y,mo-1,d);
  var i=CFG.inicio.split('-'),t0=Date.UTC(+i[0],+i[1]-1,+i[2]);
  var dow=new Date(t).getUTCDay(),dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
  return {y:y,mo:mo,d:d,days:Math.round((t-t0)/864e5),dow:dow,lastSat:(dow===6&&d+7>dim)};
}
function fmtLong(di){return DIAS[di.dow]+' '+di.d+' de '+MESES[di.mo-1]+' de '+di.y;}
function nichoEt(n){var q=nichoInfo(n);return q.et?q.et:(q.conj?'el '+q.nombre.toLowerCase():'el nicho '+n);}
function nichoInfo(n){for(var i=0;i<CFG.nichos.length;i++){if(CFG.nichos[i].n===n)return CFG.nichos[i];}return CFG.nichos[0];}

/* ---------- estado y borrador local ---------- */
var OTRO='__otro__',VACIO='__vacio__';
function freshCrew(){var c={};CFG.equipo.forEach(function(r){c[r.id]={sel:r.obligatorio?'':VACIO,sub:'',sig:''};});return c;}
function fresh(){return {fecha:today(),hora:nowTime(),creada:Date.now(),manual:false,alumno:'',obs:'',nicho:'',crew:freshCrew(),a:{}};}
function load(){
  try{
    var r=localStorage.getItem(KEY);if(!r)return null;
    var o=JSON.parse(r);if(!(o&&o.a))return null;
    o.nicho=o.nicho||'';o.alumno=o.alumno||'';
    var fc=freshCrew();o.crew=o.crew||{};
    CFG.equipo.forEach(function(q){if(!o.crew[q.id])o.crew[q.id]=fc[q.id];});
    return o;
  }catch(e){return null;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||fresh();
/* fecha y hora automáticas: un borrador de otro día (o de hace más de 14 h) se descarta y se empieza uno nuevo con la fecha y la hora actuales */
var NEWNOTE='',WIPEPH=false;
function isStale(o){
  var hasData=Object.keys(o.a||{}).length>0;
  if(!hasData)return false;
  if(o.creada)return (Date.now()-o.creada)>14*3600*1000;
  return o.fecha!==today();
}
function autoDate(){
  if(isStale(S)){NEWNOTE=S.fecha;S=fresh();WIPEPH=true;save();return true;}
  if(!Object.keys(S.a||{}).length&&!S.manual){S.fecha=today();S.hora=nowTime();save();}
  return false;
}
autoDate();
/* fotos opcionales (se guardan aparte para que un fallo de espacio no pierda el resto del borrador) */
var PH={};
function phKey(id){return KEY+'-ph-'+id;}
function phSave(id){try{if(PH[id])localStorage.setItem(phKey(id),JSON.stringify(PH[id]));else localStorage.removeItem(phKey(id));return true;}catch(e){return false;}}
function fotoItems(){var o=[];CFG.bloques.forEach(function(b){b.items.forEach(function(it){if(it.tipo==='foto')o.push(it);});});return o;}
function phWipe(){fotoItems().forEach(function(it){delete PH[it.id];try{localStorage.removeItem(phKey(it.id));}catch(e){}});}
fotoItems().forEach(function(it){try{var r=localStorage.getItem(phKey(it.id));if(r)PH[it.id]=JSON.parse(r);}catch(e){}});
if(WIPEPH)phWipe();

var LIBS={};
function loadLib(src,test,cb){

function pdfLib(){return window.pdfjsLib||window['pdfjs-dist/build/pdf']||null;}
function decodeImg(blob,cb){
  function viaBitmap(){
    if(!window.createImageBitmap){cb(null);return;}
    createImageBitmap(blob).then(function(b){cb({src:b,w:b.width,h:b.height});},function(){cb(null);});
  }

  im.onerror=function(){try{URL.revokeObjectURL(u);}catch(e){}viaBitmap();};

/* reduce: lado máximo y tamaño máximo; baja la calidad y, si hace falta, el tamaño hasta que cabe */
function compress(d,maxSide,maxChars,cb){
  var k=Math.min(1,maxSide/Math.max(d.w,d.h)),q=0.72,n=0,url='',cw=0,ch=0;
  for(;;){
    cw=Math.max(1,Math.round(d.w*k));ch=Math.max(1,Math.round(d.h*k));
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    try{var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);cx.drawImage(d.src,0,0,cw,ch);url=cv.toDataURL('image/jpeg',q);}catch(e){url='';break;}
    if(url.length<=maxChars||n>=8)break;
    n++;if(q>0.5)q-=0.1;else k*=0.8;
  }
  try{if(d.src&&d.src.close)d.src.close();}catch(e){}
  cb(url&&url.indexOf('data:image/jpeg')===0?{url:url,w:cw,h:ch}:null);
}
function pdfFirstPage(file,cb){
  loadLib(JS_PDF,pdfLib,function(ok){
    var L=ok&&pdfLib();if(!L){cb(null,0);return;}
    try{L.GlobalWorkerOptions.workerSrc=JS_PDFW;}catch(e){}
    var fr=new FileReader();
    fr.onerror=function(){cb(null,0);};
    fr.onload=function(){
      var np=0;
      L.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        np=pdf.numPages;
        return pdf.getPage(1).then(function(pg){
          var v0=pg.getViewport({scale:1}),sc=Math.min(3,1500/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:sc});
          var cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
          var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
          return pg.render({canvasContext:cx,viewport:vp}).promise.then(function(){cb({src:cv,w:cv.width,h:cv.height},np);});
        });
      }).catch(function(){cb(null,0);});
    };
    fr.readAsArrayBuffer(file);
  });
}
function heicDecode(file,cb){
  loadLib(JS_HEIC,function(){return window.libheif;},function(ok){
    if(!ok){cb(null);return;}
    var fr=new FileReader();
    fr.onerror=function(){cb(null);};
    fr.onload=function(){
      try{
        var lib=(typeof libheif==='function')?libheif():libheif;
        Promise.resolve(lib).then(function(L){
          var im=new L.HeifDecoder().decode(fr.result)[0];
          var w=im.get_width(),hh=im.get_height(),cv=document.createElement('canvas');cv.width=w;cv.height=hh;
          var cx=cv.getContext('2d'),id=cx.createImageData(w,hh);
          im.display(id,function(res){if(!res){cb(null);return;}cx.putImageData(res,0,0);cb({src:cv,w:w,h:hh});});
        }).catch(function(){cb(null);});
      }catch(e){cb(null);}
    };
    fr.readAsArrayBuffer(file);
  });
}
function sniff(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb('');};
  fr.onload=function(){
    var b=new Uint8Array(fr.result),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
    cb(s.indexOf('%PDF')===0?'pdf':(s.substr(4,4)==='ftyp'?'heic':''));
  };
  try{fr.readAsArrayBuffer(file.slice(0,16));}catch(e){cb('');}
}
/* cb(resultado|null, aviso) */
function readPhoto(file,cb){
  var nm=(file.name||'').toLowerCase(),ty=(file.type||'').toLowerCase();
  function img(d){compress(d,1000,170000,function(r){cb(r,'');});}
  function pdf(){pdfFirstPage(file,function(d,n){if(!d){cb(null,'');return;}compress(d,1400,240000,function(r){cb(r,n>1?'Se ha adjuntado la página 1 de '+n+'.':'');});});}
  function heic(){heicDecode(file,function(d){if(d)img(d);else cb(null,'');});}
  if(ty==='application/pdf'||/\.pdf$/.test(nm)){pdf();return;}
  if(/hei[cf]/.test(ty)||/\.(heic|heif)$/.test(nm)){
    decodeImg(file,function(d){if(d)img(d);else heic();});return;
  }
  decodeImg(file,function(d){
    if(d){img(d);return;}
    sniff(file,function(k){if(k==='pdf')pdf();else if(k==='heic')heic();else cb(null,'');});
  });
}

    if(isNaN(x))return 'pend';
    if(it.max!=null&&(x>it.max||x<0))return 'pend';
    if(it.min!=null&&x<it.min)return 'inc';

}

/* ---------- PDF ---------- */
function safe(s){
  var map={'‘':"'",'’':"'",'“':'"','”':'"','–':'-','—':'-','…':'...','•':'-','₂':'2',' ':' ','€':'EUR','›':'>'};
  return String(s==null?'':s).replace(/[‘’“”–—…•₂ €›]/g,function(c){return map[c];})
    .replace(/\t/g,' ').replace(/\r/g,'').replace(/[^\n\x20-\x7E¡-ÿ]/g,'')
    .replace(/ {2,}/g,' ').replace(/ +([.,;:!?])/g,'$1');
}
function fileName(){
  return 'Revision_SVAE_'+CFG.codigo.replace(/[^A-Za-z0-9]/g,'')+'_'+S.fecha+'_'+S.hora.replace(':','')+'.pdf';
}
function titleImg(){
  var txt='REVISIÓN DE UNIDAD';
  function draw(){
    try{
      var cv=document.createElement('canvas'),fs=100,sp=9,fam='"SVAE Titulo","Poppins","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
      var cx=cv.getContext('2d');cx.font='700 '+fs+'px '+fam;
      var w=0,i,ws=[];for(i=0;i<txt.length;i++){var cw=cx.measureText(txt[i]).width;ws.push(cw);w+=cw+(i<txt.length-1?sp:0);}
      cv.width=Math.ceil(w)+8;cv.height=Math.round(fs*1.5);
      cx=cv.getContext('2d');cx.font='700 '+fs+'px '+fam;cx.fillStyle='#ffffff';cx.textBaseline='alphabetic';
      var x=4;for(i=0;i<txt.length;i++){cx.fillText(txt[i],x,fs*1.12);x+=ws[i]+sp;}
      return {url:cv.toDataURL('image/png'),w:cv.width,h:cv.height};
    }catch(e){return null;}
  }
  try{
    if(document.fonts&&document.fonts.load)return document.fonts.load('700 100px "SVAE Titulo"').then(draw,draw);
  }catch(e){}
  return Promise.resolve(draw());
}
function buildPDF(TI){
  var J=window.jspdf.jsPDF;
  var doc=new J({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  var W=210,H=297,M=12,CW=W-2*M,TOP2=20,BOT=H-19,y=0;
  var C={navy:[12,36,71],gold:[245,211,28],ok:[23,121,74],inc:[179,38,30],na:[91,107,134],line:[211,221,234],ink:[22,30,46],mut:[91,107,134],soft:[241,245,249],incbg:[253,236,234],white:[255,255,255]};
  function col(c){doc.setTextColor(c[0],c[1],c[2]);}
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function stroke(c){doc.setDrawColor(c[0],c[1],c[2]);}
  function font(sz,st){doc.setFontSize(sz);doc.setFont('helvetica',st||'normal');}
  function lh(pt){return pt*0.3528*1.22;}
  function wrap(t,w){return doc.splitTextToSize(safe(t),w);}
  function ensure(n){if(y+n>BOT){doc.addPage();y=TOP2;}}
  var c=counts(),inc=incidencias();
  doc.setLineHeightFactor(1.22);

  /* ---- cabecera compacta ---- */
  fill(C.navy);doc.rect(0,0,W,24,'F');
  fill([27,74,138]);doc.rect(W*0.62,0,W*0.38,24,'F');
  fill(inc.length?C.inc:C.gold);doc.rect(0,24,W,inc.length?2.4:1.2,'F');
  try{doc.addImage(LOGO,'PNG',M,2,20,20);}catch(e){}
  var tx=M+25,tdone=false;
  if(TI){try{var th0=Math.min(10.5,92*TI.h/TI.w),tw0=th0*TI.w/TI.h;doc.addImage(TI.url,'PNG',tx,4,tw0,th0);tdone=true;}catch(e){}}
  if(!tdone){font(19,'bold');col(C.white);doc.text('REVISIÓN DE UNIDAD',tx,12);}
  font(8,'bold');col(C.gold);doc.text(safe('Inicio de guardia · '+CFG.unidad+' · '+CFG.codigo).toUpperCase(),tx,19.5);
  font(11,'bold');col(C.white);doc.text(safe(DIAS[CTX.di.dow]+' '+fmtDate(S.fecha)),W-M,9,{align:'right'});
  font(10,'bold');col(C.gold);doc.text('Hora '+S.hora,W-M,15,{align:'right'});
  font(6.5,'normal');col([200,214,236]);doc.text(safe('Generado el '+stamp()),W-M,20.5,{align:'right'});

  stats.forEach(function(s,i){

  /* ---- incidencias: lo primero que se ve ---- */

    y+=6.4;
    inc.forEach(function(q,idx){

      var l2=(q.serv||t2.length)?Math.max(1,t2.length):0;
      var hh=Math.max(7.4,t1.length*lh(IS)+l2*lh(IS)+2.6);
      ensure(hh+0.6);
      fill([251,208,203]);doc.rect(M,y,CW,hh,'F');
      fill(C.inc);doc.rect(M,y,7,hh,'F');
      font(10.5,'bold');col(C.white);doc.text(String(idx+1),M+3.5,y+hh/2+1.4,{align:'center'});

      if(t2.length){font(IS,'bold');col([140,16,10]);doc.text(t2,M+10+(pillW?pillW+2:0),y2);}
      y+=hh+0.9;
    });

  }

  /* ---- lo que está bien: resumido y en tono tenue ---- */
  var MUT=[112,122,140],MUTD=[70,85,110];
  function flowWrap(text,w1,w){
    var words=text.split(' '),lines=[],cur='',lim=w1;
    words.forEach(function(wd){
      var t=cur?cur+' '+wd:wd;
      if(!cur||doc.getTextWidth(t)<=lim)cur=t;
      else{lines.push(cur);cur=wd;lim=w;}
    });
    if(cur)lines.push(cur);
    return lines;
  }
  function part(txt,it,vals){return vals?txt+' – '+vals:txt;}
  /* párrafo: título en negrita y mayúsculas + texto tenue. below=true: el título va solo y el texto justo debajo */
  function paraOp(label,text,w,below){
    var lw=0,colon=(text&&!below)?':':'';
    if(label&&below){
      font(8,'normal');
      var lb=text?flowWrap(text,w-4,w-4):[];
      return {k:'para',label:label,colon:'',lw:0,ls:lb,below:true,h:(1+lb.length)*lh(8)+1.9};
    }
    if(label){font(7,'bold');lw=doc.getTextWidth(label+colon)+1.6;}
    font(8,'normal');
    var ls=text?flowWrap(text,w-4-lw,w-4):[];
    return {k:'para',label:label,colon:colon,lw:lw,ls:ls,h:Math.max(1,ls.length)*lh(8)+1.9};
  }
  /* oxígeno: tabla (botella · bares · nivel) en lugar de un párrafo corrido */
  var OXH_T=4.4,OXH_C=3.4,OXR_1=4.8,OXR_2=7.6;
  function oxyRow(op,grp,okI,vOf){
    var parts=grp[0].g.split(' · '),nm=parts[1]||parts[0],sub=parts.slice(2).join(' · ');
    nm=nm.charAt(0).toUpperCase()+nm.slice(1);
    var cells=op.cols.map(function(c){
      var it=null;grp.forEach(function(x){if(x.t===c)it=x;});
      if(!it)return {v:'–'};
      return status(it)==='inc'?{inc:true}:{v:vOf(it)||'–'};
    });
    var r={nm:nm,sub:sub,cells:cells,h:sub?OXR_2:OXR_1};
    op.rows.push(r);op.h+=r.h;
  }
  function layoutSec(sec,w){
    var items=reqItems(sec),ops=[],d=0,ni=0;
    items.forEach(function(it){var st=status(it);if(st==='ok'||st==='inc'||st==='na')d++;if(st==='inc')ni++;});
    ops.push({k:'msec',sec:sec,okN:items.length-ni,n:items.length,ni:ni,h:5.4});
    var i=0,singles=[];
    function flush(){if(singles.length){ops.push(paraOp('',singles.join('  ·  '),w));singles=[];}}
    while(i<items.length){
      var g=items[i].g||'',j=i+1;
      if(g){while(j<items.length&&(items[j].g||'')===g)j++;}
      var grp=items.slice(i,j);i=j;
      var okI=grp.filter(function(it){return status(it)!=='inc';});
      var vOf=function(it){return (it.tipo==='num'||it.tipo==='esc')?safe(valueText(it)):'';};
      if(g&&grp[0].gc==='verde'&&grp.every(function(it){return it.tipo==='num'||it.tipo==='esc';})){
        /* oxígeno: una sola tabla con una fila por botella (si una medida es incidencia, remite a lo de arriba) */
        flush();
        var fam=g.split(' · ')[0],lastO=ops[ops.length-1];
        if(!(lastO&&lastO.k==='oxy'&&lastO.fam===fam)){
          lastO={k:'oxy',fam:fam,label:fam.toUpperCase(),cols:[],rows:[],h:OXH_T+OXH_C+1.9};ops.push(lastO);
        }
        grp.forEach(function(it){if(lastO.cols.indexOf(it.t)===-1)lastO.cols.push(it.t);});
        oxyRow(lastO,grp,okI,vOf);
        continue;
      }
      if(!okI.length)continue;
      if(!g){
        /* sin grupo (nicho, limpiezas de hoy): siguen en una línea de sueltos */
        okI.forEach(function(it){
          var v=vOf(it),lb=it.t;
          if(it.rojo&&it.nota)lb+=' ('+it.nota+')';
          singles.push(v?lb+': '+v:lb);
        });
        continue;
      }
      flush();
      if(grp.length===1){
        /* un solo ítem con título: título propio en negrita y mayúsculas, en su línea */
        var it1=okI[0],v1=vOf(it1),lab1,txt1;
        if(g===it1.t){lab1=g;txt1=v1;}
        else if(v1){var mm=String(it1.t).match(/^([^(]+?)\s*(\(.*\))\s*$/);lab1=mm?mm[1]:it1.t;txt1=v1+(mm?' '+mm[2]:'');}
        else{lab1=g;txt1=it1.t;}
        if(it1.rojo&&it1.nota)txt1+=(txt1?' ':'')+'('+it1.nota+')';
        ops.push(paraOp(safe(lab1).toUpperCase(),txt1,w,!!it1.pdfBajo));
        continue;
      }
      ops.push(paraOp(g.toUpperCase(),okI.map(function(it){var v=vOf(it);return v?it.t+': '+v:it.t;}).join('  ·  '),w,!!grp[0].pdfBajo));
    }
    flush();
    return ops;
  }
  function photoOp(it,w,maxH){
    var ph=PH[it.id],kk=Math.min(38/ph.w,maxH/ph.h),iw=ph.w*kk,ih=ph.h*kk;
    font(7.5,'normal');var cl=doc.splitTextToSize(safe(it.t),Math.max(20,w-iw-8));
    return [{k:'photo',it:it,ph:ph,iw:iw,ih:ih,cl:cl,h:5.4+ih+3.4}];
  }
  function hOf(ops){return ops.reduce(function(s,o){return s+o.h;},0);}
  function drawOps(ops,x,y0,w){
    var yy=y0;
    ops.forEach(function(o){
      if(o.k==='msec'){
        fill([228,233,241]);doc.rect(x,yy,w,5.4,'F');
        fill([170,180,196]);doc.rect(x,yy,1.3,5.4,'F');
        var tr=o.okN+'/'+o.n+' correctos',ti=o.ni?(o.ni+(o.ni===1?' incidencia (arriba)':' incidencias (arriba)')):'';
        font(7,'normal');var tw=doc.getTextWidth(tr),rw=tw;
        if(ti){font(6.8,'bold');rw+=3+doc.getTextWidth(ti);}
        /* el título cede ante las etiquetas de la derecha: completo, sin «Nicho del día:», corto, letra menor, recortado */
        var avail=w-3-2-rw-3,full0=safe((o.sec.pdf||o.sec.titulo).replace(/\s*\(diario\)/i,'')).toUpperCase(),cand=[full0];
        if(o.sec.nicho){cand.push(full0.replace(/^NICHO DEL D[ÍI]A:\s*/,''));if(o.sec.pdfCorto)cand.push(safe(o.sec.pdfCorto).toUpperCase());}
        var ttl=cand[cand.length-1],fs=7.6;
        for(var q=0;q<cand.length;q++){font(7.6,'bold');if(doc.getTextWidth(cand[q])<=avail){ttl=cand[q];break;}}
        font(fs,'bold');
        while(fs>6&&doc.getTextWidth(ttl)>avail){fs-=0.2;font(fs,'bold');}
        while(ttl.length>4&&doc.getTextWidth(ttl)>avail){ttl=ttl.slice(0,-2).replace(/\s+$/,'')+'…';}
        col(MUTD);doc.text(ttl,x+3,yy+3.7);
        font(7,'normal');col(MUT);
        doc.text(tr,x+w-2,yy+3.7,{align:'right'});
        if(ti){font(6.8,'bold');col(C.inc);doc.text(ti,x+w-2-tw-3,yy+3.7,{align:'right'});}
      }else if(o.k==='para'){
        var y1=yy+3.2;
        if(o.label){font(7,'bold');col(MUTD);doc.text(safe(o.label)+(o.colon||''),x+2,y1);}
        font(8,'normal');col(MUT);
        o.ls.forEach(function(l,q){
          if(o.below)doc.text(safe(l),x+2,y1+(q+1)*lh(8));
          else doc.text(safe(l),x+2+(q===0?o.lw:0),y1+q*lh(8));
        });
      }else if(o.k==='oxy'){
        var NW=36,CWc=(w-4-NW)/Math.max(1,o.cols.length),yo=yy+3.2;
        font(7,'bold');col(MUTD);doc.text(safe(o.label),x+2,yo);
        var yh=yy+OXH_T;
        font(6.2,'bold');col(MUT);
        o.cols.forEach(function(c,q){doc.text(safe(c).toUpperCase(),x+3+NW+q*CWc,yh+2.3);});
        var yq=yh+OXH_C;
        o.rows.forEach(function(r,ri){
          if(ri%2===0){fill([240,243,248]);doc.rect(x+1.2,yq,w-2.4,r.h,'F');}
          var two=!!r.sub;
          font(8,'normal');col(MUTD);doc.text(safe(r.nm),x+3,yq+(two?3.2:r.h/2+1.05));
          if(two){font(6.4,'normal');col(MUT);doc.text(safe(r.sub),x+3,yq+6.1);}
          r.cells.forEach(function(c,q){
            var tx=x+3+NW+q*CWc,ty=yq+r.h/2+1.05;
            if(c.inc){font(6.8,'bold');col(C.inc);doc.text('ver arriba',tx,ty);}
            else{font(8,'normal');col(MUT);doc.text(safe(c.v),tx,ty);}
          });
          yq+=r.h;
        });
      }else if(o.k==='photo'){
        fill([228,233,241]);doc.rect(x,yy,w,5.4,'F');fill([170,180,196]);doc.rect(x,yy,1.3,5.4,'F');
        font(7.6,'bold');col(MUTD);doc.text('FOTO · PRUEBA DE USUARIO',x+3,yy+3.7);
        try{doc.addImage(o.ph.url,'JPEG',x+1.5,yy+6.8,o.iw,o.ih);}catch(e){}
        stroke(C.line);doc.setLineWidth(0.2);doc.rect(x+1.5,yy+6.8,o.iw,o.ih);
        font(7.5,'normal');col(MUT);doc.text(o.cl,x+o.iw+5,yy+10);
      }
      yy+=o.h;
    });
    return yy;
  }
  var gapC=6,cw2=(CW-gapC)/2,GAPB=3;
  var blocks=SECS.map(function(s){return layoutSec(s,cw2);});
  var hs=blocks.map(hOf);
  function colH(a,b){var s=0;for(var q=a;q<b;q++)s+=hs[q]+(q>a?GAPB:0);return s;}
  var bestK=blocks.length,bestC=1e9;
  for(var k=1;k<=blocks.length;k++){
    var cost=Math.max(colH(0,k),colH(k,blocks.length));
    if(cost<bestC-0.01){bestC=cost;bestK=k;}
  }
  if(y+bestC>BOT){doc.addPage();y=TOP2;}
  var yl=y,yr=y;
  blocks.forEach(function(b,q){
    if(q<bestK){yl=drawOps(b,M,yl,cw2)+GAPB;}
    else{yr=drawOps(b,M+cw2+gapC,yr,cw2)+GAPB;}
  });
  /* foto de la prueba de usuario: pequeña, en la columna con más hueco; se ajusta al espacio que queda */
  var fts=fotoItems().filter(function(it){return PH[it.id];}),pend=[];
  fts.forEach(function(it){
    var left=(yl<=yr),yy=left?yl:yr,xx=left?M:M+cw2+gapC;
    var avail=BOT-yy-8.8-1;
    if(avail>=22){var ops=photoOp(it,cw2,Math.min(50,avail));var ye=drawOps(ops,xx,yy,cw2)+GAPB;if(left)yl=ye;else yr=ye;}
    else pend.push(it);
  });
  y=Math.max(yl,yr)+1;
  pend.forEach(function(it){ensure(8.8+50);var ops=photoOp(it,cw2,50);y=drawOps(ops,M,y,cw2)+GAPB;});

  /* ---- observaciones ---- */
  if(S.obs.trim()){
    font(8.5,'normal');var ol=doc.splitTextToSize(safe(S.obs.trim()),CW-5);
    ensure(14);
    font(8.5,'bold');col(C.navy);doc.text('OBSERVACIONES',M,y+3);
    stroke(C.navy);doc.setLineWidth(0.4);doc.line(M,y+4.4,W-M,y+4.4);y+=7.4;
    font(8.5,'normal');col(C.ink);
    ol.forEach(function(l){ensure(lh(8.5)+1);doc.text(l,M+2.5,y);y+=lh(8.5);});
  }

  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    if(p>1){
      fill(C.navy);doc.rect(0,0,W,11,'F');fill(C.gold);doc.rect(0,11,W,0.8,'F');
      font(8.5,'bold');col(C.white);
      doc.text(safe(CFG.unidad+' · '+CFG.codigo+' · Revisión de inicio de guardia · '+fmtDate(S.fecha)+' '+S.hora),M,7);
    }
    stroke(C.line);doc.setLineWidth(0.2);doc.line(M,H-17,W-M,H-17);
    font(7.5,'normal');col(C.mut);
    doc.text(safe(CFG.unidad+' · '+CFG.codigo+' · Revisión de '+fmtDate(S.fecha)+' '+S.hora),M,H-13);
    doc.text('Página '+p+' de '+n,W-M,H-13,{align:'right'});
    font(6.5,'normal');
    doc.text(safe(CFG.creditoL1),M,H-9);
    doc.text(safe(CFG.creditoL2),M,H-5.6);
  }
  doc.setProperties({title:safe('Revisión de unidad '+CFG.unidad+' '+CFG.codigo+' - '+fmtDate(S.fecha)),author:CFG.unidad,subject:'Revisión de inicio de guardia'});
  return doc.output('blob');
}

/* ---------- entrega del PDF ---------- */
var DL=null;
var STAND=!(window.claude&&typeof window.claude.use==='function');  /* versión independiente: fuera de claude.ai */
var LASTPDF=null;
var dlReady=(window.claude&&typeof window.claude.use==='function')
  ?window.claude.use('downloads').then(function(d){DL=d||null;return DL;},function(){return null;})
  :Promise.resolve(null);

function ensureLib(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(true);
  return new Promise(function(res){
    var CDN='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    var load=function(src,fail){
      var s=document.createElement('script');
      s.src=src;
      s.onload=function(){res(!!(window.jspdf&&window.jspdf.jsPDF));};
      s.onerror=function(){if(fail)fail();else res(false);};
      document.head.appendChild(s);
    };
    if(STAND)load('lib/jspdf.umd.min.js',function(){load(CDN);});   /* primero la copia propia, después la CDN */
    else load(CDN);
  });
}
function deliver(blob,name){
  return dlReady.then(function(){
    if(DL){
      return DL.save({filename:name,data:blob}).then(function(r){return {how:'saved',status:r&&r.status};},function(e){
        var c=(e&&e.code)||'desconocido';
        if(c==='declined')return {how:'declined'};
        return fallback(blob,name).then(function(r){r.code=c;return r;});
      });
    }
    return fallback(blob,name).then(function(r){r.nodl=true;return r;});
  });
}
function fallback(blob,name){
  var file=null;try{file=new File([blob],name,{type:'application/pdf'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){return {how:'shared'};},function(e){
      return (e&&e.name==='AbortError')?{how:'declined'}:anchor(blob,name);
    });
  }
  return Promise.resolve(anchor(blob,name));
}
function anchor(blob,name){
  var u=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);
  return {how:'download'};
}

function onGenerate(mode){
  var p=problems();
  if(p.length){
    var cnt=function(k){return p.filter(function(x){return x.kind===k;}).length;};
    var pend=cnt('pend'),nn=cnt('incnote'),ncrew=cnt('crew'),nsub=cnt('sub');
    var parts=[];
    if(ncrew)parts.push('elegir '+ncrew+(ncrew===1?' puesto':' puestos')+' del equipo');
    if(nsub)parts.push('escribir el nombre de '+nsub+(nsub===1?' sustituto':' sustitutos'));
    if(pend)parts.push(pend+(pend===1?' punto sin revisar':' puntos sin revisar'));
    if(nn)parts.push(nn+(nn===1?' incidencia sin describir':' incidencias sin describir'));
    showMsg('Antes de generar el PDF falta: '+parts.join(', ')+'.','bad');
    ALL.forEach(function(x){var b=$('it-'+x.it.id);if(b)b.classList.add('flag');updateItem(x.it);});
    p.forEach(function(x){
      var e=$(x.id);if(!e)return;
      if(x.kind==='crew'||x.kind==='sub')e.classList.add('err');
    });
    goTo(p[0].id);
    return;
  }
  showMsg('','');
  var b1=$('gen'),b2=$('genwa');b1.disabled=true;b2.disabled=true;
  var active=(mode==='wa')?b2:b1;active.textContent='Generando PDF…';
  ensureLib().then(function(ok){
    if(!ok)throw new Error('lib');
    return titleImg();
  }).then(function(TI){
    var blob=buildPDF(TI),name=fileName();
    LASTPDF={blob:blob,name:name};
    return deliver(blob,name).then(function(r){showResult(r,name,mode);});
  }).catch(function(e){
    var m=(e&&e.message)||'error';
    showMsg(m==='lib'?'No se ha podido cargar el generador de PDF. Comprueba la conexión a internet y vuelve a pulsar. Mientras tanto puedes enviar el resumen por WhatsApp (botones de abajo).':'No se ha podido generar el PDF ('+m+'). Vuelve a pulsar. Mientras tanto puedes enviar el resumen por WhatsApp (botones de abajo).','bad');
    try{showResult({how:'nopdf',code:(m==='lib'?'generador de PDF no cargado':'error al generar: '+m)},'',mode);}catch(e2){}
  }).then(function(){
    b1.disabled=false;b2.disabled=false;b1.textContent='Generar PDF';b2.textContent='Generar PDF y enviar por WhatsApp';
  });
}

function showResult(r,name,mode){
  var box=$('result');box.textContent='';box.hidden=false;
  var txt=resumen(r.how==='saved'||r.how==='shared'||(STAND&&r.how==='download'));
  var enc=encodeURIComponent(txt);
  var ua=navigator.userAgent||'';
  var isAnd=/Android/i.test(ua),isIos=/iPhone|iPad|iPod/i.test(ua);
  var waApp='whatsapp://send?text='+enc;          /* abre directamente la aplicación */
  var waWeb='https://wa.me/?text='+enc;           /* enlace estándar de WhatsApp */
  var body=h('div',{class:'body'});
  var head;
  var waBtns=function(){
    var d=h('div',{class:'wablock'});
    d.appendChild(h('p',{class:'wah',text:'Enviar el resumen por WhatsApp (texto con las incidencias):'}));
    var a1=h('a',{class:'btn wa',href:waApp,text:'Abrir la aplicación de WhatsApp'});
    var a2=h('a',{class:'btn'+(mode==='wa'?'':' alt'),href:waWeb,target:'_blank',rel:'noopener',text:'Abrir WhatsApp (enlace normal)'});
    if(isAnd){d.appendChild(a2);d.appendChild(a1);}else{d.appendChild(a1);d.appendChild(a2);}
    d.appendChild(h('p',{class:'wan',text:'Si un botón no abre WhatsApp, prueba el otro. Elige el grupo «'+CFG.grupoWhatsApp+'».'}));
    return d;
  };
  var pdfBtns=function(){
    if(!(STAND&&LASTPDF))return;
    var f=null,can=false;
    try{f=new File([LASTPDF.blob],LASTPDF.name,{type:'application/pdf'});can=!!(navigator.canShare&&navigator.canShare({files:[f]}));}catch(e){}
    if(can)body.appendChild(h('button',{class:'primary',type:'button',text:'Compartir el PDF (WhatsApp…)',onclick:function(){try{navigator.share({files:[f],title:LASTPDF.name}).catch(function(){});}catch(e){}}}));
    body.appendChild(h('button',{class:'secondary',type:'button',text:'Descargar el PDF',onclick:function(){anchor(LASTPDF.blob,LASTPDF.name);}}));
  };
  if(r.how==='declined'){
    head='PDF no enviado';
    body.appendChild(h('p',{text:STAND?'No se ha enviado el PDF. Puedes volver a compartirlo o descargarlo con los botones de abajo.':'No se ha guardado el PDF. Pulsa de nuevo el botón cuando quieras.'}));
    pdfBtns();
    body.appendChild(waBtns());
  }else{
    var good=(r.how==='saved'||r.how==='shared'||(STAND&&r.how==='download'));
    if(STAND&&r.how==='download'){
      head='PDF descargado';
      body.appendChild(h('p',{text:'El PDF «'+name+'» se ha descargado en el teléfono (carpeta Descargas). Para mandarlo: abre WhatsApp, entra en el grupo «'+CFG.grupoWhatsApp+'», pulsa el clip › Documento y elige el PDF.'}));
      pdfBtns();
    }else if(good){
      head=(mode==='wa')?'Último paso: WhatsApp':'PDF listo';
      body.appendChild(h('p',{text:'PDF «'+name+'» preparado.'}));
      body.appendChild(h('p',{text:((isIos||STAND)?'Si se ha abierto la hoja de compartir, elige WhatsApp y el grupo «'+CFG.grupoWhatsApp+'»: el PDF va adjunto y ya está. ':'')+'Si el PDF se ha guardado en el teléfono (carpeta Descargas), ábrelo en WhatsApp: entra en el grupo «'+CFG.grupoWhatsApp+'», pulsa el clip › Documento y elige el PDF.'}));
      pdfBtns();
    }else if(r.how==='download'){
      head='PDF no disponible en este móvil';
      body.appendChild(h('p',{class:'warnp',text:'Claude solo deja guardar el PDF a miembros de la organización del propietario. Envía el resumen por WhatsApp con los botones de abajo.'}));
    }else{
      head='No se ha podido crear el PDF';
      body.appendChild(h('p',{class:'warnp',text:'El PDF no se ha podido generar o guardar en este visor.'}));
      body.appendChild(h('p',{text:'Puedes enviar ya el resumen por WhatsApp con los botones de abajo, o volver a pulsar «Generar PDF».'}));
    }
    body.appendChild(waBtns());
    body.appendChild(h('button',{class:'secondary',type:'button',text:'Copiar el resumen',onclick:function(ev){
      var b=ev.target;
      try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Resumen copiado';},function(){b.textContent='No se pudo copiar';});}catch(e){b.textContent='No se pudo copiar';}
    }}));
  }
  var dg=[STAND?'versión independiente':'descargas: '+(DL?'sí':'no'),(isAnd?'Android':(isIos?'iPhone/iPad':'otro'))];
  if(r.code)dg.push('código: '+r.code);
  if(r.how)dg.push('resultado: '+r.how);
  body.appendChild(h('p',{class:'diag',text:'Detalle técnico (por si hay que avisar): '+dg.join(' · ')}));
  box.appendChild(h('h2',{text:head}));box.appendChild(body);
  box.scrollIntoView({block:'start',behavior:'smooth'});
}

$('logo').src=LOGOBIG;
render();
})();
</script>
</body>
