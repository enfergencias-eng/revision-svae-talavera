:root{--tit:"SVAE Titulo","Poppins","Avenir Next","Montserrat","Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,#d4e3f8 0,#e6eefa 340px,#eef4fc 100%) fixed;color:var(--ink);font:16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
@media (prefers-color-scheme:dark){body{background:#04112b linear-gradient(180deg,#04112b 0,#071c44 55%,#0a2a5c 100%) fixed}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b2a5c;z-index:20}
header{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:20px 14px 22px;color:#fff;border-bottom:5px solid var(--gold);
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='60' viewBox='0 0 360 60'><path d='M0 30 H70 L82 30 L90 12 L102 50 L112 4 L122 30 H190 L202 30 L210 18 L220 44 L228 30 H360' fill='none' stroke='%2348c888' stroke-opacity='.38' stroke-width='2.5' stroke-linejoin='round'/></svg>") center 46px /360px 60px repeat-x,
  linear-gradient(160deg,#061633 0%,#0b2a5c 48%,#1b4a8a 100%)}
.logo{position:relative;width:112px;height:112px;border-radius:50%;flex:none;background:#0c2447;box-shadow:0 0 0 4px rgba(245,211,28,.9),0 8px 22px rgba(0,0,0,.4)}
header h1{position:relative;margin:16px 0 0;font:700 clamp(1.7rem,8.2vw,2.5rem)/1.05 var(--tit);text-transform:uppercase;letter-spacing:.07em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
header p{position:relative;margin:8px 0 0;color:var(--gold);font:700 .95rem/1.2 var(--tit);letter-spacing:.06em;text-transform:uppercase}
main{max-width:680px;margin:0 auto;padding:0 14px 40px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warnt);border:1.5px solid var(--gold);font-size:.92rem}
.banner button{margin-top:8px}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:0 -14px;padding:8px 14px;background:rgba(230,238,250,.96);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-color-scheme:dark){#bar{background:rgba(6,20,44,.96)}}

var CFG=JSON.parse(document.getElementById('svae-config').textContent);
var KEY='svae-ta-revision-v4';
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var CTX={},SECS=[],ALL=[];

/* ---------- utilidades ---------- */
function p2(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function nowTime(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());}
function fmtDate(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(iso||'');}
function stamp(){var d=new Date();return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function mod(a,n){return ((a%n)+n)%n;}
function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function $(id){return document.getElementById(id);}

/* ---------- calendario: nicho del día, ampulario, limpieza ---------- */
function dayInfo(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3],t=Date.UTC(y,mo-1,d);
  var i=CFG.inicio.split('-'),t0=Date.UTC(+i[0],+i[1]-1,+i[2]);
  var dow=new Date(t).getUTCDay(),dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
  return {y:y,mo:mo,d:d,days:Math.round((t-t0)/864e5),dow:dow,lastSat:(dow===6&&d+7>dim)};
}
function fmtLong(di){return DIAS[di.dow]+' '+di.d+' de '+MESES[di.mo-1]+' de '+di.y;}
function nichoInfo(n){for(var i=0;i<CFG.nichos.length;i++){if(CFG.nichos[i].n===n)return CFG.nichos[i];}return CFG.nichos[0];}

/* ---------- estado y borrador local ---------- */
var OTRO='__otro__',VACIO='__vacio__';
function freshCrew(){var c={};CFG.equipo.forEach(function(r){c[r.id]={sel:r.obligatorio?'':VACIO,sub:'',sig:''};});return c;}
function fresh(){return {fecha:today(),hora:nowTime(),obs:'',nicho:'',crew:freshCrew(),a:{}};}
function load(){
  try{
    var r=localStorage.getItem(KEY);if(!r)return null;
    var o=JSON.parse(r);if(!(o&&o.a))return null;
    o.nicho=o.nicho||'';
    var fc=freshCrew();o.crew=o.crew||{};
    CFG.equipo.forEach(function(q){if(!o.crew[q.id])o.crew[q.id]=fc[q.id];});
    return o;
  }catch(e){return null;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||fresh();
/* fotos opcionales (se guardan aparte para que un fallo de espacio no pierda el resto del borrador) */
var PH={};
function phKey(id){return KEY+'-ph-'+id;}
function phSave(id){try{if(PH[id])localStorage.setItem(phKey(id),JSON.stringify(PH[id]));else localStorage.removeItem(phKey(id));return true;}catch(e){return false;}}
function fotoItems(){var o=[];CFG.bloques.forEach(function(b){b.items.forEach(function(it){if(it.tipo==='foto')o.push(it);});});return o;}
function phWipe(){fotoItems().forEach(function(it){delete PH[it.id];try{localStorage.removeItem(phKey(it.id));}catch(e){}});}

/* ---------- fotos: cualquier formato (JPG, PNG, WebP, HEIC… y PDF); siempre se reducen al insertarlas ---------- */
var JS_PDF='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    JS_PDFW='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
    JS_HEIC='https://cdn.jsdelivr.net/npm/libheif-js@1.23.5/libheif/libheif.js';
var LIBS={};
function loadLib(src,test,cb){
  if(test()){cb(true);return;}
  if(LIBS[src]){LIBS[src].push(cb);return;}
  var q=LIBS[src]=[cb],s=document.createElement('script');
  function end(ok){LIBS[src]=null;q.forEach(function(f){f(ok);});}
  s.onload=function(){end(!!test());};s.onerror=function(){end(false);};
  s.async=true;s.src=src;document.head.appendChild(s);
}
function pdfLib(){return window.pdfjsLib||window['pdfjs-dist/build/pdf']||null;}
function decodeImg(blob,cb){
  function viaBitmap(){
    if(!window.createImageBitmap){cb(null);return;}
    createImageBitmap(blob).then(function(b){cb({src:b,w:b.width,h:b.height});},function(){cb(null);});
  }
  var u='';try{u=URL.createObjectURL(blob);}catch(e){}
  if(!u){viaBitmap();return;}
  var im=new Image();
  im.onload=function(){try{URL.revokeObjectURL(u);}catch(e){}if(im.naturalWidth)cb({src:im,w:im.naturalWidth,h:im.naturalHeight});else viaBitmap();};
  im.onerror=function(){try{URL.revokeObjectURL(u);}catch(e){}viaBitmap();};
  im.src=u;
}
/* reduce: lado máximo y tamaño máximo; baja la calidad y, si hace falta, el tamaño hasta que cabe */
function compress(d,maxSide,maxChars,cb){
  var k=Math.min(1,maxSide/Math.max(d.w,d.h)),q=0.72,n=0,url='',cw=0,ch=0;
  for(;;){
    cw=Math.max(1,Math.round(d.w*k));ch=Math.max(1,Math.round(d.h*k));
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    try{var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);cx.drawImage(d.src,0,0,cw,ch);url=cv.toDataURL('image/jpeg',q);}catch(e){url='';break;}
    if(url.length<=maxChars||n>=8)break;
    n++;if(q>0.5)q-=0.1;else k*=0.8;
  }
  try{if(d.src&&d.src.close)d.src.close();}catch(e){}
  cb(url&&url.indexOf('data:image/jpeg')===0?{url:url,w:cw,h:ch}:null);
}
function pdfFirstPage(file,cb){
  loadLib(JS_PDF,pdfLib,function(ok){
    var L=ok&&pdfLib();if(!L){cb(null,0);return;}
    try{L.GlobalWorkerOptions.workerSrc=JS_PDFW;}catch(e){}
    var fr=new FileReader();
    fr.onerror=function(){cb(null,0);};
    fr.onload=function(){
      var np=0;
      L.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        np=pdf.numPages;
        return pdf.getPage(1).then(function(pg){
          var v0=pg.getViewport({scale:1}),sc=Math.min(3,1500/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:sc});
          var cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
          var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
          return pg.render({canvasContext:cx,viewport:vp}).promise.then(function(){cb({src:cv,w:cv.width,h:cv.height},np);});
        });
      }).catch(function(){cb(null,0);});
    };
    fr.readAsArrayBuffer(file);
  });
}
function heicDecode(file,cb){
  loadLib(JS_HEIC,function(){return window.libheif;},function(ok){
    if(!ok){cb(null);return;}
    var fr=new FileReader();
    fr.onerror=function(){cb(null);};
    fr.onload=function(){
      try{
        var lib=(typeof libheif==='function')?libheif():libheif;
        Promise.resolve(lib).then(function(L){
          var im=new L.HeifDecoder().decode(fr.result)[0];
          var w=im.get_width(),hh=im.get_height(),cv=document.createElement('canvas');cv.width=w;cv.height=hh;
          var cx=cv.getContext('2d'),id=cx.createImageData(w,hh);
          im.display(id,function(res){if(!res){cb(null);return;}cx.putImageData(res,0,0);cb({src:cv,w:w,h:hh});});
        }).catch(function(){cb(null);});
      }catch(e){cb(null);}
    };
    fr.readAsArrayBuffer(file);
  });
}
function sniff(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb('');};
  fr.onload=function(){
    var b=new Uint8Array(fr.result),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
    cb(s.indexOf('%PDF')===0?'pdf':(s.substr(4,4)==='ftyp'?'heic':''));
  };
  try{fr.readAsArrayBuffer(file.slice(0,16));}catch(e){cb('');}
}
/* cb(resultado|null, aviso) */
function readPhoto(file,cb){
  var nm=(file.name||'').toLowerCase(),ty=(file.type||'').toLowerCase();
  function img(d){compress(d,1000,170000,function(r){cb(r,'');});}
  function pdf(){pdfFirstPage(file,function(d,n){if(!d){cb(null,'');return;}compress(d,1400,240000,function(r){cb(r,n>1?'Se ha adjuntado la página 1 de '+n+'.':'');});});}
  function heic(){heicDecode(file,function(d){if(d)img(d);else cb(null,'');});}
  if(ty==='application/pdf'||/\.pdf$/.test(nm)){pdf();return;}
  if(/hei[cf]/.test(ty)||/\.(heic|heif)$/.test(nm)){
    decodeImg(file,function(d){if(d)img(d);else heic();});return;
  }
  decodeImg(file,function(d){
    if(d){img(d);return;}
    sniff(file,function(k){if(k==='pdf')pdf();else if(k==='heic')heic();else cb(null,'');});
  });
}

function computeSections(){
  var di=dayInfo(S.fecha)||dayInfo(today());
  var auto=mod(di.days,CFG.ciclo)+1;
  var sel=parseInt(S.nicho,10);
  var n=(sel>=1&&sel<=CFG.ciclo)?sel:auto;
  CTX={di:di,auto:auto,nicho:n,over:(n!==auto)};
  var secs=[];
  CFG.bloques.forEach(function(b){
    var items=[];
    b.items.forEach(function(it){
      if(it.tipo==='ruedas'){
        it.ruedas.forEach(function(r){
          items.push({id:it.id+'-'+r.id,g:it.g,t:r.t,tipo:'esc',niveles:it.niveles,colores:it.colores,incHasta:it.incHasta,incNiv:it.incNiv,
            rueda:r.id,rgrp:it.id,notaLbl:'Rueda '+r.t.toLowerCase()+' · incidencia (obligatorio): qué le ocurre',ph:it.ph,motivos:it.motivos,motLbl:'Rueda '+r.t.toLowerCase()+' · motivo de la incidencia',detLbl:'Rueda '+r.t.toLowerCase()+' · detalles (opcional)',servicio:it.servicio,fuerte:it.fuerte,
            alerta:it.alerta?('Rueda '+r.t.toLowerCase()+': '+it.alerta):''});
        });
      }else items.push(it);
    });
    secs.push({id:b.id,tema:b.id,kicker:b.kicker,titulo:b.titulo,pdf:b.pdf||b.titulo,items:items});
  });
  var nn=nichoInfo(n),base=(nn.extra||[]).concat(CFG.nichoItems.filter(function(x){return (nn.omitir||[]).indexOf(x.id)===-1;}));
  var items=base.map(function(x){return {id:'n'+nn.n+'-'+x.id,t:x.t,ok:x.ok,notaLbl:x.notaLbl,ph:x.ph,motivos:x.motivos,detalleObl:x.detalleObl};});
  (nn.asoc||[]).forEach(function(a,i){items.push({id:'n'+nn.n+'-asoc'+i,t:a+': revisado',ok:'Hecho'});});
  secs.push({id:'nicho',tema:'nicho',kicker:'Nicho del día',titulo:(nn.titulo||nn.nombre),sub:nn.sub||'',pdf:'Nicho del día: '+nn.nombre,items:items,figs:figNicho(nn),nicho:true});
  var li=[];
  CFG.limpiezas.forEach(function(l){
    if((l.cuando==='lunes'&&di.dow===1)||(l.cuando==='ultimoSabado'&&di.lastSat)){
      li.push({id:'lim-'+l.id,t:l.t,rojo:!!l.rojo,nota:l.nota||'',tag:l.tag||'',ok:l.ok,chip:l.chip});
    }
  });
  if(li.length)secs.push({id:'limpieza',tema:'limpieza',kicker:'Limpieza de hoy',titulo:li.map(function(x){return x.chip;}).join(' + '),pdf:'Limpieza de hoy',items:li,rojo:li.some(function(x){return x.rojo;})});
  return secs;
}
function recompute(){

}

/* ---------- estado de cada ítem ---------- */
function ans(it){return S.a[it.id]||(S.a[it.id]={v:'',n:'',m:''});}
var OTROS='Otros';
function motivosDe(it){return it.motivos||CFG.motivos||[];}
function motivoSel(a){a=a||{};return (a.m&&a.m!==OTROS)?a.m:'';}
function noteOk(it,a){var d=(a.n||'').trim();return it.detalleObl?!!d:(!!d||!!motivoSel(a));}
function isInc(it,i){i=parseInt(i,10);if(isNaN(i))return false;return it.incNiv?it.incNiv.indexOf(i)!==-1:i<=it.incHasta;}
/* un valor en bares marca solo el nivel (>= umbral: primer nivel, verde; si no: segundo, rojo); un toque manual lo cambia */
function autoNivel(it){
  if(!it.auto)return;
  var tg=null;ALL.forEach(function(x){if(x.it.id===it.auto.nivel)tg=x.it;});if(!tg)return;
  var a=ans(it),x=numVal(a),b=ans(tg);
  var ok=a.v!==''&&!isNaN(x)&&x>=0&&(it.max==null||x<=it.max);
  if(ok){b.v=(x>=it.auto.umbral)?'0':'1';b.auto=true;}
  else if(b.auto){b.v='';b.auto=false;}
  save();updateItem(tg);
}
function reqItems(sec){return sec.items.filter(function(it){return it.tipo!=='foto';});}
function okLabel(it){return it.ok||'Operativo';}
function full(it){return (it.g&&it.g!==it.t?it.g+' · ':'')+it.t;}
function numVal(a){return parseFloat(String(a.v).replace(',','.'));}
function status(it){
  var a=S.a[it.id];
  if(!a||a.v===''||a.v==null)return 'pend';
  if(it.tipo==='num'){
    var x=numVal(a);
    if(isNaN(x))return 'pend';
    if(it.max!=null&&(x>it.max||x<0))return 'pend';
    if(it.min!=null&&x<it.min)return 'inc';
    return 'ok';
  }
  if(it.tipo==='esc'){
    var i=parseInt(a.v,10);
    if(isNaN(i)||i<0||i>=it.niveles.length)return 'pend';
    if(isInc(it,i))return (it.notaOpc||noteOk(it,a))?'inc':'incnote';
    return 'ok';
  }
  if(a.v==='inc')return noteOk(it,a)?'inc':'incnote';
  return a.v==='ok'?'ok':'pend';
}
function itemNote(it){
  var a=S.a[it.id]||{};
  if(it.tipo==='num'){
    var x=numVal(a);
    if(it.min!=null&&!isNaN(x)&&x<it.min)return 'Valor por debajo del mínimo ('+it.min+' '+(it.unidad||'')+').';
    return '';
  }
  var d=(a.n||'').trim(),m=motivoSel(a);
  return m?(d?m+': '+d:m):d;
}
function valueText(it){
  var a=S.a[it.id]||{};
  if(it.tipo==='num')return (a.v||'-')+' '+(it.unidad||'');
  if(it.tipo==='esc'){var i=parseInt(a.v,10);return isNaN(i)?'-':it.niveles[i];}
  return '';
}
function counts(){
  var c={ok:0,inc:0,na:0,pend:0,incnote:0,total:ALL.length};
  ALL.forEach(function(x){c[status(x.it)]++;});
  c.done=c.ok+c.inc+c.na;
  return c;
}

function isPerson(c){return !!c.sel&&c.sel!==VACIO&&(c.sel!==OTRO||!!c.sub.trim());}
function crewName(r){var c=S.crew[r.id];if(c.sel===VACIO||!c.sel)return '';return c.sel===OTRO?c.sub.trim():c.sel;}
function crewProblems(){

/* firma o dibujo libre con el dedo: varios trazos, sin borrar nada salvo con los botones */
function makePad(rid){
  var cv=h('canvas',{width:'360',height:'280','aria-label':'Zona de firma o dibujo libre'});
  var ctx=cv.getContext('2d');
  ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0c2447';
  var pad=h('div',{class:'sigpad'},[cv,h('span',{class:'sighint',text:'Firma o dibuja aquí con el dedo'})]);
  var gut=function(){return h('div',{class:'siggut','aria-hidden':'true'},[h('b',{text:'↕'}),h('span',{text:'Aquí puedes deslizar'})]);};
  var wrap=h('div',{class:'sigwrap'+(S.crew[rid].sig?' has':'')},[gut(),pad,gut()]);
  var drawing=false,last=null,strokes=[],cur=null,base=null,undoBtn=null;
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
  function refresh(){if(undoBtn)undoBtn.disabled=!strokes.length;}
  function paintAll(){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(base){var k=Math.min(cv.width/base.width,cv.height/base.height),w=base.width*k,hh=base.height*k;ctx.drawImage(base,(cv.width-w)/2,(cv.height-hh)/2,w,hh);}
    strokes.forEach(function(st){
      ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);
      if(st.length===1)ctx.lineTo(st[0].x+0.1,st[0].y);else for(var i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);
      ctx.stroke();
    });
  }
  /* guarda el dibujo completo y una copia recortada (para el PDF) */
  function persist(){
    var c=S.crew[rid],d=ctx.getImageData(0,0,cv.width,cv.height).data,x0=cv.width,y0=cv.height,x1=-1,y1=-1;
    for(var y=0;y<cv.height;y++)for(var x=0;x<cv.width;x++){if(d[(y*cv.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1<0){c.sig='';c.sigc='';c.sigr=0;wrap.classList.remove('has');}
    else{
      var m=8;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(cv.width-1,x1+m);y1=Math.min(cv.height-1,y1+m);
      var w=x1-x0+1,hh=y1-y0+1,t=document.createElement('canvas');t.width=w;t.height=hh;
      t.getContext('2d').drawImage(cv,x0,y0,w,hh,0,0,w,hh);
      c.sig=cv.toDataURL('image/png');c.sigc=t.toDataURL('image/png');c.sigr=w/hh;
      wrap.classList.add('has');
    }
    save();updateAll();refresh();
  }
  if(S.crew[rid].sig){
    var im=new Image();im.onload=function(){base=im;paintAll();};im.src=S.crew[rid].sig;
  }
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    drawing=true;last=pos(e);cur=[last];strokes.push(cur);
    try{cv.setPointerCapture(e.pointerId);}catch(x){}
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+0.1,last.y);ctx.stroke();
    wrap.classList.add('has');wrap.classList.remove('err');
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing)return;e.preventDefault();
    var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    cur.push(p);last=p;
  });
  function end(){if(!drawing)return;drawing=false;persist();}
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  wrap.clear=function(){strokes=[];base=null;ctx.clearRect(0,0,cv.width,cv.height);var c=S.crew[rid];c.sig='';c.sigc='';c.sigr=0;wrap.classList.remove('has');save();updateAll();refresh();};
  wrap.undo=function(){if(!strokes.length)return;strokes.pop();paintAll();persist();};
  wrap.setUndoBtn=function(b){undoBtn=b;refresh();};
  return wrap;
}

function buildCrewCard(){
  var body=h('div',{class:'body'});
  CFG.equipo.forEach(function(r){
    var c=S.crew[r.id];
    var sel=h('select',{id:'crew-'+r.id+'-sel','aria-label':r.t});
    if(r.obligatorio)sel.appendChild(h('option',{value:'',text:'Selecciona…'}));
    r.nombres.forEach(function(nm){sel.appendChild(h('option',{value:nm,text:nm}));});
    sel.appendChild(h('option',{value:OTRO,text:'Otro / sustituto…'}));
    sel.appendChild(h('option',{value:VACIO,text:r.obligatorio?'Puesto sin cubrir':'Sin '+r.t.toLowerCase()}));
    sel.value=c.sel;
    var sub=h('div',{class:'sub',id:'crew-'+r.id+'-subw',hidden:true},[
      h('label',{for:'crew-'+r.id+'-sub',text:'Sustituto:'}),
      h('input',{id:'crew-'+r.id+'-sub',type:'text',autocomplete:'off',placeholder:'Nombre y apellidos',value:c.sub,
        oninput:function(e){c.sub=e.target.value;e.target.classList.remove('err');save();showPad();updateAll();}})
    ]);
    var padHolder=h('div',{class:'sig',id:'crew-'+r.id+'-sig',tabindex:'-1',hidden:true});
    var pad=makePad(r.id);
    var who=h('span',{text:''});
    padHolder.appendChild(pad);
    var undoB=h('button',{class:'small',type:'button',text:'Deshacer trazo',onclick:function(){pad.undo();}});
    pad.setUndoBtn(undoB);
    padHolder.appendChild(h('div',{class:'sigrow'},[who,h('div',{class:'sigbtns'},[undoB,h('button',{class:'small',type:'button',text:'Borrar todo',onclick:function(){pad.clear();}})])]));
    function showPad(){
      sub.hidden=(c.sel!==OTRO);
      var ok=isPerson(c);
      padHolder.hidden=!ok;
      who.textContent=ok?('Firma de '+crewName(r)):'';
    }
    sel.addEventListener('change',function(e){
      var prev=c.sel;c.sel=e.target.value;e.target.classList.remove('err');
      if(c.sel!==prev){c.sig='';c.sigc='';c.sigr=0;pad.classList.remove('has');pad.clear();}
      if(c.sel!==OTRO){c.sub='';}
      save();showPad();updateAll();
      if(c.sel===OTRO){var t=$('crew-'+r.id+'-sub');if(t)t.focus();}
    });
    showPad();
    body.appendChild(h('div',{class:'crew'},[h('label',{for:'crew-'+r.id+'-sel',text:r.t}),sel,sub,padHolder]));
  });
  return h('section',{class:'card'},[h('h2',{text:'Equipo de guardia'}),body]);
}

function noteLbl(it){return it.notaLbl||(it.notaOpc?'Comentario (opcional)':'Incidencia (obligatorio): qué ocurre y por qué no se puede reponer o arreglar');}
function makeNote(it){

    var opts=[h('option',{value:'',text:'Elige el motivo…'})];
    motivosDe(it).forEach(function(m){opts.push(h('option',{value:m,text:m}));});
    opts.push(h('option',{value:OTROS,text:OTROS}));
    kids.push(h('label',{for:'mt-'+it.id,text:it.motLbl||'Motivo de la incidencia'}));
    kids.push(h('select',{id:'mt-'+it.id,class:'motivo',onchange:function(e){ans(it).m=e.target.value;save();updateItem(it);updateAll();if(e.target.value===OTROS){var t2=$('nt-'+it.id);if(t2)t2.focus();}}},opts));
  }
  kids.push(h('label',{for:'nt-'+it.id,id:'nl-'+it.id,text:noteLbl(it)}));
  kids.push(h('textarea',{id:'nt-'+it.id,rows:'2',placeholder:it.ph||'',oninput:function(e){ans(it).n=e.target.value;save();updateItem(it);updateAll();}}));

  w.querySelector('textarea').value=a0.n||'';

function paintNote(it,st,flag){
  var a=S.a[it.id]||{},m=motivoSel(a),l=$('nl-'+it.id),s=$('mt-'+it.id),ta=$('nt-'+it.id);
  if(l)l.textContent=(!it.notaOpc&&m&&!it.detalleObl)?(it.detLbl||'Detalles (opcional)'):noteLbl(it);
  if(s&&s.value!==(a.m||''))s.value=a.m||'';

function escColor(it,i){
  if(it.colores)return it.colores[i];
  if(it.niveles.length===2)return isInc(it,i)?'#d6241c':'#1f8a54';
  return '';
}
function darkText(hex){
  var m=/^#([0-9a-f]{6})$/i.exec(hex||'');if(!m)return false;
  var n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255>0.6;
}
function makeEsc(it){

  });
  g.addEventListener('click',function(ev){

  for(k in WHEELS){

      +'<rect id="rw-'+k+'" x="'+x+'" y="'+y+'" width="18" height="48" rx="6" fill="#16233a" stroke="currentColor" stroke-width="2.4"/><g stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round">'+t+'</g>';

   /* retrovisores */
   +'<rect x="15" y="72" width="9" height="15" rx="3" fill="currentColor" fill-opacity=".55"/><rect x="80" y="72" width="9" height="15" rx="3" fill="currentColor" fill-opacity=".55"/>'
   /* capó y parabrisas */
   +'<g fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"><path d="M32 68 Q52 58 72 68"/><path d="M31 140 L73 140"/></g>'
   +'<path d="M33 88 L71 88 L75 126 L29 126 Z" fill="#3078e8" fill-opacity=".4" stroke="currentColor" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>'
   +'<path d="M52 88 L52 126" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/>'
   /* barra de luces */
   +'<rect x="31" y="158" width="21" height="9" rx="3" fill="#d6241c"/><rect x="52" y="158" width="21" height="9" rx="3" fill="#3078e8"/>'
   /* techo de la célula sanitaria */

   +'<rect x="29" y="178" width="46" height="282" rx="10"/><rect x="42" y="192" width="20" height="16" rx="4"/><rect x="42" y="414" width="20" height="16" rx="4"/>'
   +'<line x1="52" y1="446" x2="52" y2="480"/><line x1="29" y1="468" x2="75" y2="468"/></g>'
   +'<g stroke="#3078e8" stroke-opacity=".7" stroke-width="5" stroke-linecap="round">'+star+'</g>'
   +'<rect x="27" y="478" width="8" height="4" rx="2" fill="#d6241c"/><rect x="69" y="478" width="8" height="4" rx="2" fill="#d6241c"/>'

function resumen(conPdf){

  L.push('Revisión de inicio de guardia');

  L.push('');
  if(inc.length){
    L.push('⚠️ *'+inc.length+(inc.length===1?' INCIDENCIA':' INCIDENCIAS')+':*');
    inc.forEach(function(i){L.push('• '+i.sec+' › '+i.item+(i.note?': '+i.note:''));});
  }else{L.push('✅ *Sin incidencias*');}
  if(S.obs.trim()){L.push('');L.push('📝 '+S.obs.trim());}
  L.push('');
  L.push('Revisados '+c.done+'/'+c.total+' (correctos '+c.ok+' · incidencias '+c.inc+')');
  if(conPdf!==false)L.push('📎 PDF con el informe completo, adjunto.');
  return L.join('\n');
}

/* ---------- PDF ---------- */
function safe(s){
  var map={'‘':"'",'’':"'",'“':'"','”':'"','–':'-','—':'-','…':'...','•':'-','₂':'2',' ':' ','€':'EUR','›':'>'};
  return String(s==null?'':s).replace(/[‘’“”–—…•₂ €›]/g,function(c){return map[c];})
    .replace(/\t/g,' ').replace(/\r/g,'').replace(/[^\n\x20-\x7E¡-ÿ]/g,'')
    .replace(/ {2,}/g,' ').replace(/ +([.,;:!?])/g,'$1');
}
function fileName(){
  return 'Revision_SVAE_'+CFG.codigo.replace(/[^A-Za-z0-9]/g,'')+'_'+S.fecha+'_'+S.hora.replace(':','')+'.pdf';
}
function titleImg(){
  var txt='REVISIÓN DE UNIDAD';
  function draw(){
    try{
      var cv=document.createElement('canvas'),fs=100,sp=9,fam='"SVAE Titulo","Poppins","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
      var cx=cv.getContext('2d');cx.font='700 '+fs+'px '+fam;
      var w=0,i,ws=[];for(i=0;i<txt.length;i++){var cw=cx.measureText(txt[i]).width;ws.push(cw);w+=cw+(i<txt.length-1?sp:0);}
      cv.width=Math.ceil(w)+8;cv.height=Math.round(fs*1.5);
      cx=cv.getContext('2d');cx.font='700 '+fs+'px '+fam;cx.fillStyle='#ffffff';cx.textBaseline='alphabetic';
      var x=4;for(i=0;i<txt.length;i++){cx.fillText(txt[i],x,fs*1.12);x+=ws[i]+sp;}
      return {url:cv.toDataURL('image/png'),w:cv.width,h:cv.height};
    }catch(e){return null;}
  }
  try{
    if(document.fonts&&document.fonts.load)return document.fonts.load('700 100px "SVAE Titulo"').then(draw,draw);
  }catch(e){}
  return Promise.resolve(draw());
}
function buildPDF(TI){
  var J=window.jspdf.jsPDF;
  var doc=new J({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  var W=210,H=297,M=14,CW=W-2*M,TOP2=20,BOT=H-17,y=0;
  var C={navy:[12,36,71],gold:[245,211,28],ok:[23,121,74],inc:[179,38,30],na:[91,107,134],line:[211,221,234],ink:[22,30,46],mut:[91,107,134],soft:[241,245,249],incbg:[253,236,234],white:[255,255,255]};
  function col(c){doc.setTextColor(c[0],c[1],c[2]);}
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function stroke(c){doc.setDrawColor(c[0],c[1],c[2]);}
  function font(sz,st){doc.setFontSize(sz);doc.setFont('helvetica',st||'normal');}
  function lh(pt){return pt*0.3528*1.22;}
  function wrap(t,w){return doc.splitTextToSize(safe(t),w);}
  function ensure(n){if(y+n>BOT){doc.addPage();y=TOP2;}}
  var c=counts(),inc=incidencias();

  fill(C.navy);doc.rect(0,0,W,46,'F');
  fill([27,74,138]);doc.rect(W*0.55,0,W*0.45,46,'F');
  fill(C.gold);doc.rect(0,46,W,1.6,'F');
  try{doc.addImage(LOGO,'PNG',M,4,38,38);}catch(e){}
  var xc=(M+44+W-M)/2;
  var tdone=false;
  if(TI){try{var tw=Math.min(124,W-M-(M+44)-4),th=TI.h/TI.w*tw;doc.addImage(TI.url,'PNG',xc-tw/2,13.4,tw,th);tdone=true;}catch(e){}}
  if(!tdone){font(24,'bold');col(C.white);doc.text('REVISIÓN DE UNIDAD',xc,21,{align:'center'});}
  font(10.5,'bold');col(C.gold);doc.text(safe('Inicio de guardia · '+CFG.unidad+' · '+CFG.codigo).toUpperCase(),xc,31,{align:'center'});
  font(8.5,'normal');col([200,214,236]);doc.text(safe('Informe generado el '+stamp()),xc,37.5,{align:'center'});

  y=57;
  function field(label,val,x,w){
    font(7,'bold');col(C.mut);doc.text(safe(label).toUpperCase(),x,y);
    font(10.5,'bold');col(C.ink);var ls=wrap(val||'-',w);doc.text(ls,x,y+4.8);
    return 4.8+ls.length*lh(10.5);
  }
  var cw3=CW/3;
  var r1=Math.max(field('Fecha',DIAS[CTX.di.dow]+' '+fmtDate(S.fecha),M,2*cw3-3),field('Hora',S.hora,M+2*cw3,cw3-3));
  y+=r1+3;
  y+=1;
  font(11,'bold');col(C.navy);doc.text('EQUIPO DE GUARDIA',M,y);y+=2;
  stroke(C.navy);doc.setLineWidth(0.5);doc.line(M,y,W-M,y);y+=3;
  CFG.equipo.forEach(function(r){
    var cc=S.crew[r.id];
    if(cc.sel===VACIO&&!r.obligatorio)return;
    ensure(17);
    var nm=crewName(r);
    font(7,'bold');col(C.mut);doc.text(safe(r.t).toUpperCase(),M,y+3);
    font(10.5,'bold');
    if(nm){col(C.ink);doc.text(wrap((cc.sel===OTRO?'Sustituto: ':'')+nm,CW-52),M,y+8);}
    else{col(C.inc);doc.text('Puesto sin cubrir',M,y+8);}
    if(nm&&cc.sig){
      stroke(C.line);doc.setLineWidth(0.2);doc.rect(W-M-46,y,46,16);
      try{
        var im=cc.sigc||cc.sig,ra=cc.sigc?(cc.sigr||3):3,bw=44,bh=15,iw=bh*ra,ih=bh;
        if(iw>bw){iw=bw;ih=bw/ra;}
        doc.addImage(im,'PNG',W-M-46+(46-iw)/2,y+(16-ih)/2,iw,ih);
      }catch(e){}
    }
    y+=18;
  });
  y+=1;
  var r4=field('Nicho del día',nichoTexto(),M,CW);
  y+=r4+3;

  y+=1;
  var bad=inc.length>0;
  fill(bad?C.inc:C.ok);doc.roundedRect(M,y,CW,13,2,2,'F');
  font(13,'bold');col(C.white);
  doc.text(safe(bad?(inc.length+(inc.length===1?' INCIDENCIA A REVISAR':' INCIDENCIAS A REVISAR')):'REVISIÓN SIN INCIDENCIAS'),W/2,y+8.5,{align:'center'});
  y+=17;
  var bw=(CW-6)/3,stats=[['Revisados',c.done+'/'+c.total,C.ink],['Correctos',String(c.ok),C.ok],['Incidencias',String(c.inc),C.inc]];
  stats.forEach(function(s,i){
    var x=M+i*(bw+3);
    fill(C.soft);doc.roundedRect(x,y,bw,14,2,2,'F');
    font(13,'bold');col(s[2]);doc.text(s[1],x+bw/2,y+7,{align:'center'});
    font(7.5,'normal');col(C.mut);doc.text(safe(s[0]),x+bw/2,y+11.5,{align:'center'});
  });
  y+=20;

  if(inc.length){
    ensure(14);
    font(11,'bold');col(C.inc);doc.text('INCIDENCIAS DETECTADAS',M,y);y+=2;
    stroke(C.inc);doc.setLineWidth(0.5);doc.line(M,y,W-M,y);y+=5;
    inc.forEach(function(i){
      font(10,'bold');var t1=wrap(i.sec+'  >  '+i.item,CW-7);
      font(9.5,'normal');var t2=i.note?wrap(i.note,CW-7):[];
      var hh=t1.length*lh(10)+t2.length*lh(9.5)+3;
      ensure(hh);
      fill(C.inc);doc.circle(M+1.6,y-1.2,1,'F');
      font(10,'bold');col(C.ink);doc.text(t1,M+6,y);
      if(t2.length){font(9.5,'normal');col(C.inc);doc.text(t2,M+6,y+t1.length*lh(10));}
      y+=hh+1;
    });
    y+=4;
  }

  SECS.forEach(function(sec){
    ensure(9.4+14);
    var d=0,ri=reqItems(sec);ri.forEach(function(it){var st=status(it);if(st==='ok'||st==='inc'||st==='na')d++;});
    var gold=(sec.tema==='nicho'&&!sec.rojo);
    fill(sec.rojo?C.inc:(gold?C.gold:C.navy));doc.rect(M,y,CW,8.5,'F');
    fill(sec.rojo?[255,208,204]:(gold?C.navy:[72,200,136]));doc.rect(M,y+8.5,CW,0.9,'F');
    font(11,'bold');col(gold?C.navy:C.white);doc.text(safe(sec.pdf||sec.titulo).toUpperCase(),M+2.5,y+5.9);
    font(8.5,'bold');col(gold?C.navy:(sec.rojo?C.white:C.gold));doc.text(d+'/'+ri.length,W-M-2.5,y+5.8,{align:'right'});
    y+=9.4;
    var lg='';
    sec.items.forEach(function(it){
      if(it.g&&it.g!==lg){
        ensure(7+9);
        var gv=(it.gc==='verde');
        fill(gv?[214,240,226]:[219,231,247]);doc.rect(M,y,CW,7,'F');
        fill(gv?C.ok:C.gold);doc.rect(M,y,1.8,7,'F');
        font(9,'bold');col(gv?[16,98,60]:C.navy);doc.text(safe(it.g).toUpperCase(),M+4.5,y+4.9);
        y+=7;
      }
      lg=it.g||'';
      if(it.tipo==='foto'){
        var ph=PH[it.id];
        font(9.5,'normal');var fl=wrap(it.t,CW-48);
        var iw=0,ih=0;
        if(ph){var kk=Math.min(110/ph.w,140/ph.h);iw=ph.w*kk;ih=ph.h*kk;}
        var fh=Math.max(8,fl.length*lh(9.5)+4.4)+(ph?ih+3:0);
        ensure(fh);
        font(9.5,'normal');col(C.ink);doc.text(fl,M+2.5,y+5);
        font(9.5,'bold');col(ph?C.ok:C.na);doc.text(ph?'ADJUNTA':'SIN FOTO',W-M-2.5,y+5,{align:'right'});
        if(ph){try{doc.addImage(ph.url,'JPEG',M+2.5,y+5+fl.length*lh(9.5)+1,iw,ih);}catch(e){}}
        stroke(C.line);doc.setLineWidth(0.2);doc.line(M,y+fh,W-M,y+fh);
        y+=fh;
        return;
      }
      var st=status(it);
      font(9.5,it.rojo?'bold':'normal');var ls=(it.g&&it.g===it.t)?[]:wrap(it.t,CW-48);
      font(9,'italic');
      var extra=[];
      if(it.nota&&!it.soloApp)extra.push({t:it.nota,c:it.rojo?C.inc:C.mut});
      if(st==='inc'&&it.servicio)extra.push({t:'AVISAR AL SERVICIO TÉCNICO',c:C.inc});
      if(st==='inc'&&itemNote(it))extra.push({t:'Incidencia: '+itemNote(it),c:C.inc});
      var xl=extra.map(function(e){return {l:wrap(e.t,CW-48),c:e.c};});
      var nlines=xl.reduce(function(s,e){return s+e.l.length;},0);
      var hh=Math.max(8,ls.length*lh(9.5)+nlines*lh(9)+4.4);
      ensure(hh);
      if(st==='inc'){fill(C.incbg);doc.rect(M,y,CW,hh,'F');}
      font(9.5,it.rojo?'bold':'normal');col(it.rojo?C.inc:C.ink);doc.text(ls,M+2.5,y+5);
      var yy=y+5+ls.length*lh(9.5);
      xl.forEach(function(e){font(9,'italic');col(e.c);doc.text(e.l,M+2.5,yy);yy+=e.l.length*lh(9);});
      var rt='',rc=C.ink;
      if(it.tipo==='num'){rt=safe(valueText(it));rc=(st==='inc')?C.inc:C.ink;}
      else if(it.tipo==='esc'){rt=safe(valueText(it)).toUpperCase();rc=(st==='inc')?C.inc:C.ok;}
      else if(st==='ok'){rt=okLabel(it).toUpperCase();rc=C.ok;}
      else if(st==='inc'){rt='INCIDENCIA';rc=C.inc;}
      else{rt='SIN REVISAR';rc=C.inc;}
      font(9.5,'bold');col(rc);doc.text(rt,W-M-2.5,y+5,{align:'right'});
      stroke(C.line);doc.setLineWidth(0.2);doc.line(M,y+hh,W-M,y+hh);
      y+=hh;
    });
    y+=6;
  });

  if(S.obs.trim()){
    font(9.5,'normal');var ol=wrap(S.obs.trim(),CW-5);
    ensure(14+Math.min(ol.length,3)*lh(9.5));
    font(11,'bold');col(C.navy);doc.text('OBSERVACIONES',M,y);y+=2;
    stroke(C.navy);doc.setLineWidth(0.5);doc.line(M,y,W-M,y);y+=5;
    font(9.5,'normal');col(C.ink);
    ol.forEach(function(l){ensure(lh(9.5)+1);doc.text(l,M+2.5,y);y+=lh(9.5);});
    y+=4;
  }

  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    if(p>1){
      fill(C.navy);doc.rect(0,0,W,11,'F');fill(C.gold);doc.rect(0,11,W,0.8,'F');
      font(8.5,'bold');col(C.white);
      doc.text(safe(CFG.unidad+' · '+CFG.codigo+' · Revisión de inicio de guardia · '+fmtDate(S.fecha)+' '+S.hora),M,7);
    }
    stroke(C.line);doc.setLineWidth(0.2);doc.line(M,H-12,W-M,H-12);
    font(7.5,'normal');col(C.mut);
    doc.text(safe(CFG.unidad+' · '+CFG.codigo+' · Revisión de '+fmtDate(S.fecha)+' '+S.hora),M,H-8);
    doc.text('Página '+p+' de '+n,W-M,H-8,{align:'right'});
  }
  doc.setProperties({title:safe('Revisión de unidad '+CFG.unidad+' '+CFG.codigo+' - '+fmtDate(S.fecha)),author:CFG.unidad,subject:'Revisión de inicio de guardia'});
  return doc.output('blob');
}

/* ---------- entrega del PDF ---------- */
var DL=null;
var STAND=!(window.claude&&typeof window.claude.use==='function');  /* versión independiente: fuera de claude.ai */
var LASTPDF=null;
var dlReady=(window.claude&&typeof window.claude.use==='function')
  ?window.claude.use('downloads').then(function(d){DL=d||null;return DL;},function(){return null;})
  :Promise.resolve(null);

function ensureLib(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(true);
  return new Promise(function(res){
    var CDN='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    var load=function(src,fail){
      var s=document.createElement('script');
      s.src=src;
      s.onload=function(){res(!!(window.jspdf&&window.jspdf.jsPDF));};
      s.onerror=function(){if(fail)fail();else res(false);};
      document.head.appendChild(s);
    };
    if(STAND)load('lib/jspdf.umd.min.js',function(){load(CDN);});   /* primero la copia propia, después la CDN */
    else load(CDN);
  });
}
function deliver(blob,name){
  return dlReady.then(function(){
    if(DL){
      return DL.save({filename:name,data:blob}).then(function(r){return {how:'saved',status:r&&r.status};},function(e){
        var c=(e&&e.code)||'desconocido';
        if(c==='declined')return {how:'declined'};
        return fallback(blob,name).then(function(r){r.code=c;return r;});
      });
    }
    return fallback(blob,name).then(function(r){r.nodl=true;return r;});
  });
}
function fallback(blob,name){
  var file=null;try{file=new File([blob],name,{type:'application/pdf'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){return {how:'shared'};},function(e){
      return (e&&e.name==='AbortError')?{how:'declined'}:anchor(blob,name);
    });
  }
  return Promise.resolve(anchor(blob,name));
}
function anchor(blob,name){
  var u=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);
  return {how:'download'};
}

function onGenerate(mode){
  var p=problems();
  if(p.length){
    var cnt=function(k){return p.filter(function(x){return x.kind===k;}).length;};
    var pend=cnt('pend'),nn=cnt('incnote'),ncrew=cnt('crew'),nsub=cnt('sub'),nsig=cnt('sig');
    var parts=[];
    if(ncrew)parts.push('elegir '+ncrew+(ncrew===1?' puesto':' puestos')+' del equipo');
    if(nsub)parts.push('escribir el nombre de '+nsub+(nsub===1?' sustituto':' sustitutos'));
    if(nsig)parts.push(nsig+(nsig===1?' firma':' firmas'));
    if(pend)parts.push(pend+(pend===1?' punto sin revisar':' puntos sin revisar'));
    if(nn)parts.push(nn+(nn===1?' incidencia sin describir':' incidencias sin describir'));
    showMsg('Antes de generar el PDF falta: '+parts.join(', ')+'.','bad');
    ALL.forEach(function(x){var b=$('it-'+x.it.id);if(b)b.classList.add('flag');updateItem(x.it);});
    p.forEach(function(x){
      var e=$(x.id);if(!e)return;
      if(x.kind==='crew'||x.kind==='sub')e.classList.add('err');
      if(x.kind==='sig'){var w=e.querySelector('.sigwrap');if(w)w.classList.add('err');}
    });
    goTo(p[0].id);
    return;
  }
  showMsg('','');
  var b1=$('gen'),b2=$('genwa');b1.disabled=true;b2.disabled=true;
  var active=(mode==='wa')?b2:b1;active.textContent='Generando PDF…';
  ensureLib().then(function(ok){
    if(!ok)throw new Error('lib');
    return titleImg();
  }).then(function(TI){
    var blob=buildPDF(TI),name=fileName();
    LASTPDF={blob:blob,name:name};
    return deliver(blob,name).then(function(r){showResult(r,name,mode);});
  }).catch(function(e){
    var m=(e&&e.message)||'error';
    showMsg(m==='lib'?'No se ha podido cargar el generador de PDF. Comprueba la conexión a internet y vuelve a pulsar. Mientras tanto puedes enviar el resumen por WhatsApp (botones de abajo).':'No se ha podido generar el PDF ('+m+'). Vuelve a pulsar. Mientras tanto puedes enviar el resumen por WhatsApp (botones de abajo).','bad');
    try{showResult({how:'nopdf',code:(m==='lib'?'generador de PDF no cargado':'error al generar: '+m)},'',mode);}catch(e2){}
  }).then(function(){
    b1.disabled=false;b2.disabled=false;b1.textContent='Generar PDF';b2.textContent='Generar PDF y enviar por WhatsApp';
  });
}

function showResult(r,name,mode){
  var box=$('result');box.textContent='';box.hidden=false;
  var txt=resumen(r.how==='saved'||r.how==='shared'||(STAND&&r.how==='download'));
  var enc=encodeURIComponent(txt);
  var ua=navigator.userAgent||'';
  var isAnd=/Android/i.test(ua),isIos=/iPhone|iPad|iPod/i.test(ua);
  var waApp='whatsapp://send?text='+enc;          /* abre directamente la aplicación */
  var waWeb='https://wa.me/?text='+enc;           /* enlace estándar de WhatsApp */
  var body=h('div',{class:'body'});
  var head;
  var waBtns=function(){
    var d=h('div',{class:'wablock'});
    d.appendChild(h('p',{class:'wah',text:'Enviar el resumen por WhatsApp (texto con las incidencias):'}));
    var a1=h('a',{class:'btn wa',href:waApp,text:'Abrir la aplicación de WhatsApp'});
    var a2=h('a',{class:'btn'+(mode==='wa'?'':' alt'),href:waWeb,target:'_blank',rel:'noopener',text:'Abrir WhatsApp (enlace normal)'});
    if(isAnd){d.appendChild(a2);d.appendChild(a1);}else{d.appendChild(a1);d.appendChild(a2);}
    d.appendChild(h('p',{class:'wan',text:'Si un botón no abre WhatsApp, prueba el otro. Elige el grupo «'+CFG.grupoWhatsApp+'».'}));
    return d;
  };
  var pdfBtns=function(){
    if(!(STAND&&LASTPDF))return;
    var f=null,can=false;
    try{f=new File([LASTPDF.blob],LASTPDF.name,{type:'application/pdf'});can=!!(navigator.canShare&&navigator.canShare({files:[f]}));}catch(e){}
    if(can)body.appendChild(h('button',{class:'primary',type:'button',text:'Compartir el PDF (WhatsApp…)',onclick:function(){try{navigator.share({files:[f],title:LASTPDF.name}).catch(function(){});}catch(e){}}}));
    body.appendChild(h('button',{class:'secondary',type:'button',text:'Descargar el PDF',onclick:function(){anchor(LASTPDF.blob,LASTPDF.name);}}));
  };
  if(r.how==='declined'){
    head='PDF no enviado';
    body.appendChild(h('p',{text:STAND?'No se ha enviado el PDF. Puedes volver a compartirlo o descargarlo con los botones de abajo.':'No se ha guardado el PDF. Pulsa de nuevo el botón cuando quieras.'}));
    pdfBtns();
    body.appendChild(waBtns());
  }else{
    var good=(r.how==='saved'||r.how==='shared'||(STAND&&r.how==='download'));
    if(STAND&&r.how==='download'){
      head='PDF descargado';
      body.appendChild(h('p',{text:'El PDF «'+name+'» se ha descargado en el teléfono (carpeta Descargas). Para mandarlo: abre WhatsApp, entra en el grupo «'+CFG.grupoWhatsApp+'», pulsa el clip › Documento y elige el PDF.'}));
      pdfBtns();
    }else if(good){
      head=(mode==='wa')?'Último paso: WhatsApp':'PDF listo';
      body.appendChild(h('p',{text:'PDF «'+name+'» preparado.'}));
      body.appendChild(h('p',{text:((isIos||STAND)?'Si se ha abierto la hoja de compartir, elige WhatsApp y el grupo «'+CFG.grupoWhatsApp+'»: el PDF va adjunto y ya está. ':'')+'Si el PDF se ha guardado en el teléfono (carpeta Descargas), ábrelo en WhatsApp: entra en el grupo «'+CFG.grupoWhatsApp+'», pulsa el clip › Documento y elige el PDF.'}));
      pdfBtns();
    }else if(r.how==='download'){
      head='PDF no disponible en este móvil';
      body.appendChild(h('p',{class:'warnp',text:'Claude solo deja guardar el PDF a miembros de la organización del propietario. Envía el resumen por WhatsApp con los botones de abajo.'}));
    }else{
      head='No se ha podido crear el PDF';
      body.appendChild(h('p',{class:'warnp',text:'El PDF no se ha podido generar o guardar en este visor.'}));
      body.appendChild(h('p',{text:'Puedes enviar ya el resumen por WhatsApp con los botones de abajo, o volver a pulsar «Generar PDF».'}));
    }
    body.appendChild(waBtns());
    body.appendChild(h('button',{class:'secondary',type:'button',text:'Copiar el resumen',onclick:function(ev){
      var b=ev.target;
      try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Resumen copiado';},function(){b.textContent='No se pudo copiar';});}catch(e){b.textContent='No se pudo copiar';}
    }}));
  }
  var dg=[STAND?'versión independiente':'descargas: '+(DL?'sí':'no'),(isAnd?'Android':(isIos?'iPhone/iPad':'otro'))];
  if(r.code)dg.push('código: '+r.code);
  if(r.how)dg.push('resultado: '+r.how);
  body.appendChild(h('p',{class:'diag',text:'Detalle técnico (por si hay que avisar): '+dg.join(' · ')}));
  box.appendChild(h('h2',{text:head}));box.appendChild(body);
  box.scrollIntoView({block:'start',behavior:'smooth'});
}

$('logo').src=LOGO;
render();
})();
</script>
